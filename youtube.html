<!DOCTYPE html>
<html lang="eng">
<head> 
  <title> YouTube.com Clone</title>
  <link rel="stylesheet" href="youtube.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <input type="text" placeholder="Search" class="search-bar">
  <div class="video-preview ">
    <div class="thumbnail-row">
      <img src="thumbnails/thumbnail-1.webp" class="thumbnail" alt="Marques Brownlee and Sundar Pichai">
    </div>
    <div>
      <div class="channel-profile">
        <img src="Channel Profiles/channel-1.jpeg" class="profile-picture">
      </div>
      <div class="video-info">
        <p class="video-title">
          Talking Tech and AI with Google CEO Sundar Pichai!
        </p>
        <p class="video-arthur">
          Marques Brownlee
        </p>
        <p class="video-stats">
          3.4M views &#183; 6 months ago
        </p>
      </div>
    </div>
  </div>

  <div class="video-preview ">
    <div class="thumbnail-row">
      <img src="thumbnails/thumbnail-2.webp" class="thumbnail" alt="Man Laughing">
    </div>
    <div>
      <div class="channel-profile">
        <img src="Channel Profiles/channel-2.jpeg" class="profile-picture">
      </div>
      <div class="video-info">
        <p class="video-title">
          Try Not To laugh Challenge #9
        </p>
        <p class="video-arthur">
          Markiplier
        </p>
        <p class="video-stats">
          19M views &#183; 4 years ago
        </p>
      </div>
    </div>
  </div>
</body>
</html>
